name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: delgarmi
          POSTGRES_USER: delgarmi
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U delgarmi -d delgarmi"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: delgarmi
      POSTGRES_USER: delgarmi
      POSTGRES_PASSWORD: ci-only
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Django deployment checks
        run: |
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          export DJANGO_SECRET_KEY
          PANEL_PATH=panel-ci python manage.py check --deploy --fail-level WARNING
      - name: Migrations match the models
        run: DJANGO_SETTINGS_MODULE=config.settings_test python manage.py makemigrations --check --dry-run
      - run: python -m pytest

  web:
    name: Web unit tests and build
    runs-on: ubuntu-24.04
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build (includes the type check)
        run: npm run build

  stack:
    name: Whole stack in Docker, browser tests
    runs-on: ubuntu-24.04
    env:
      SITE: stack.delgarmi.test
    steps:
      - uses: actions/checkout@v7
      - name: Settings and a self-signed certificate, as the installer would make them
        run: |
          certs="$RUNNER_TEMP/certs"
          mkdir -p "$certs/live/$SITE"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=$SITE" -addext "subjectAltName=DNS:$SITE" \
            -keyout "$certs/live/$SITE/privkey.pem" -out "$certs/live/$SITE/fullchain.pem"
          {
            echo "SITE_DOMAIN=$SITE"
            echo "DJANGO_ALLOWED_HOSTS=$SITE"
            echo "DJANGO_SECRET_KEY=$(openssl rand -hex 48)"
            echo "PANEL_PATH=panel-ci-stack"
            echo "POSTGRES_DB=delgarmi"
            echo "POSTGRES_USER=delgarmi"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "CERTS_DIR=$certs"
          } > .env
          echo "127.0.0.1 $SITE" | sudo tee -a /etc/hosts
      - name: Build the images and start the five services
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Switch two services on in Isfahan, so the tests see both states
        run: |
          docker compose exec -T api python manage.py shell -c "
          from catalog.models import City, Service
          City.objects.get(slug='isfahan').set_active_services(Service.objects.filter(slug__in=['elderly-care', 'home-nursing']))"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the browser tests
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser tests through nginx (axe, keyboard, widths, links, availability)
        working-directory: web
        env:
          BASE_URL: https://stack.delgarmi.test
        run: npm run test:e2e
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7

  release:
    name: Mark as tested (the server deploys it)
    needs: [api, web, stack]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      # The server follows this branch (deploy/update.sh), so only tested commits reach it.
      - name: Move the release branch to this commit
        run: git push --force origin HEAD:refs/heads/release
