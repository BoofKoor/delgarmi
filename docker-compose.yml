# Delgarmi: five services on one server. Only nginx is reachable from outside (80 and 443).
# Values come from .env next to this file. The web and api images are built by GitHub Actions
# and loaded onto the server; they are never pulled from a registry.
name: delgarmi

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: delgarmi-api:latest
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    image: delgarmi-api:latest
    pull_policy: never
    restart: unless-stopped
    command: ["python", "manage.py", "run_worker"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "notifications.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  web:
    image: delgarmi-web:latest
    pull_policy: never
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      PANEL_PATH: ${PANEL_PATH}
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ${CERTS_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  pgdata:
